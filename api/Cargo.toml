[package]
name = "survival-mesh-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Survival Mesh — servidor API local (Capa 4)"

[[bin]]
name = "survival-mesh-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
anyhow = "1"
